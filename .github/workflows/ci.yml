name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install spherov2 bleak ruff
      - name: Lint
        run: ruff check .
      - name: Compile examples
        run: python -m compileall -q examples
      - name: Desktop examples import
        run: |
          for f in examples/desktop/*.py; do
            python -c "import importlib.util as u, sys; s = u.spec_from_file_location('m', sys.argv[1]); s.loader.exec_module(u.module_from_spec(s))" "$f"
          done
