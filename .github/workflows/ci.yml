name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e '.[test]' ruff
      - name: Lint
        run: ruff check .
      - name: Tests (simulator)
        run: python -m pytest -q
      - name: Desktop examples import
        run: |
          for f in examples/desktop/*.py; do
            python -c "import importlib.util as u, sys; s = u.spec_from_file_location('m', sys.argv[1]); s.loader.exec_module(u.module_from_spec(s))" "$f"
          done
      - name: CLI smoke test
        run: sphero-dev run examples/edu_app/circles.py --sim --seconds 10
