# XcodeGen spec for the iPad/iPhone app. On a Mac (see README.md):
#   brew install xcodegen && cd ios && scripts/fetch-python.sh && xcodegen
#   open SpheroChat.xcodeproj
name: SpheroChat
options:
  bundleIdPrefix: dev.clegg
  deploymentTarget:
    iOS: "17.0"
packages:
  SpheroChatCore:
    path: SpheroChatCore
targets:
  SpheroChat:
    type: application
    platform: iOS
    sources: [SpheroChat]
    dependencies:
      - package: SpheroChatCore
      - framework: Frameworks/Python.xcframework
        embed: true
        codeSign: true
    postBuildScripts:
      - name: Install Python and sphero_dev
        script: '"$PROJECT_DIR/scripts/install-python.sh"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.clegg.spherochat
        PRODUCT_NAME: Sphero Chat
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SWIFT_OBJC_BRIDGING_HEADER: SpheroChat/Python/PythonBridge.h
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: ["$(inherited)", "$(BUILT_PRODUCTS_DIR)"]
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(BUILT_PRODUCTS_DIR)/Python.framework/Headers"]
    info:
      path: SpheroChat/Info.plist
      properties:
        CFBundleDisplayName: Sphero Chat
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft,
           UIInterfaceOrientationLandscapeRight]
        NSMicrophoneUsageDescription: To dictate what the robot should do.
        NSSpeechRecognitionUsageDescription: To turn what you say into text in the message box.
        NSBluetoothAlwaysUsageDescription: To connect to your Sphero robot and drive it.
